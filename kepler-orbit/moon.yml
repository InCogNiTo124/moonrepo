tags:
- docker
layer: application
project:
  description: Keplerian orbit visualization
  title: kepler-orbit
language: typescript
tasks:
  install:
    command: bun
    args:
    - install
    inputs:
    - package.json
    - bun.lock
  check:
    command: tsc
    args:
    - --noEmit
    deps:
    - ~:install
  build:
    command: bun
    args:
    - run
    - build
    deps:
    - ~:install
    # Vite strips types without checking them.
    - ~:check
    outputs:
    - dist/**
    options:
      merge: replace
