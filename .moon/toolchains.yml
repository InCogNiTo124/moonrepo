rust:
  version: 1.94.1
  targets:
  - x86_64-unknown-linux-musl
  - wasm32-unknown-unknown
bun:
  installArgs:
    - "--ignore-scripts"
    - "--frozen-lockfile"
unstable_uv:
  syncArgs:
    - "--frozen"
    - "--no-build"
unstable_python: {}
javascript:
  packageManager: bun
  inferTasksFromScripts: true
  syncPackageManagerField: true
  syncProjectWorkspaceDependencies: true
