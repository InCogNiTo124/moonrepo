tags:
- sveltekit
- docker
layer: application
project:
  description: Brachistochrone visualizer
  title: brachi
dependsOn:
- brachistochrone-solver
tasks:
  install:
    command: bun
    args:
    - install
    deps:
    # brachi's package.json has "wasm": "file:../crates/brachistochrone_solver/pkg"
    # which requires the wasm-pack output to exist before bun install can resolve it.
    # See also: the stub workaround in .github/workflows/ci.yml
    - brachistochrone-solver:build
    inputs:
    - package.json
    - bun.lock
  build:
    command: bun
    args:
    - run
    - build
    deps:
    - ~:install
    - brachistochrone-solver:build
    outputs:
    - build/**
    options:
      merge: replace
