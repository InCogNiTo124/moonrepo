tags:
- sveltekit
- docker
layer: application
project:
  description: Personal website
  title: personal-website
tasks:
  install:
    command: bun
    args:
    - install
    inputs:
    - package.json
    - bun.lock
  check:
    deps:
    - ~:install
    - personal-reusables:build
  build:
    command: bun
    args:
    - run
    - build
    deps:
    - ~:install
    - personal-reusables:build
    outputs:
    - build/**
    options:
      merge: replace
