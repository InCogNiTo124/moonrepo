# Resolve the local twin's domains to the VM.
# dnsmasq on this host is managed by NetworkManager (dns=dnsmasq), which reads
# /etc/NetworkManager/dnsmasq.d/ — NOT /etc/dnsmasq.d/, and the standalone
# dnsmasq.service must stay disabled (port 53 is taken by NM's instance).
# Install: sudo cp dnsmasq-cosmos-local.conf /etc/NetworkManager/dnsmasq.d/ && sudo systemctl restart NetworkManager
address=/msmetko.test/192.168.100.10
address=/terra-incognita.test/192.168.100.10
