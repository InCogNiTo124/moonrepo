tags:
- sveltekit
layer: library
language: typescript
workspace:
  inheritedTasks:
    # Source-only library: the sites compile src/lib themselves, so there is
    # nothing to build, serve or preview here. `check` is the one real task,
    # and the sites depend on it.
    exclude:
    - build
    - dev
    - preview
tasks:
  install:
    command: bun
    args:
    - install
    inputs:
    - package.json
    - bun.lock
  check:
    deps:
    - ~:install
toolchains:
  default: bun
