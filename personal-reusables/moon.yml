tags:
- sveltekit
layer: library
language: typescript
tasks:
  install:
    command: bun
    args:
    - install
    inputs:
    - package.json
    - bun.lock
  build:
    command: bun
    args:
    - run
    - build
    deps:
    - ~:install
    outputs:
    - dist/**
    options:
      merge: replace
toolchains:
  default: bun
