tags:
- sveltekit
layer: library
language: typescript
tasks:
  install:
    command: bun
    args:
    - install
    inputs:
    - package.json
    - bun.lock
  check:
    # Components import this package by its own name ('personal-reusables'),
    # which bun resolves through package.json exports into dist/. So dist/ has
    # to exist before svelte-check runs, or every self-import fails with
    # "Cannot find module 'personal-reusables'" on a clean checkout. Going via
    # build also serialises it after install, whose postinstall runs the same
    # `svelte-kit sync` the check script does and races it otherwise.
    deps:
    - ~:build
  build:
    command: bun
    args:
    - run
    - build
    deps:
    - ~:install
    outputs:
    - dist/**
    options:
      merge: replace
toolchains:
  default: bun
