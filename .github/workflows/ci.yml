name: "Moon CI"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to run"
        required: false
        default: ""
        type: string

jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    env:
      RUSTUP_TOOLCHAIN: "1.94.0"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-dev musl-tools

      - name: Login to GitHub Container Registry
        uses: docker/login-action@master
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: "actions/checkout@main"
        with:
          fetch-depth: 0

      - uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true
          auto-setup: true
          cache: false

      - run:
          "moon ${{ github.event.inputs.targets && github.event.inputs.targets || 'ci'}}"

      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Collect/retrospect on results"
        uses: "appthrust/moon-ci-retrospect@main"
        if: always()
