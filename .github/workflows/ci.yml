name: "Moon CI"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to run"
        required: false
        default: ""
        type: string

jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-dev musl-tools

      - name: Login to GitHub Container Registry
        uses: docker/login-action@master
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: "actions/checkout@main"
        with:
          fetch-depth: 0

      - uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true
          auto-setup: true
          cache: false

      # Proto installs Rust via rustup, but setup-rust defaults to installing
      # targets on 'stable'. Pin the channel to match the version in
      # .moon/toolchains.yml so targets land on the correct toolchain.
      - uses: moonrepo/setup-rust@v1
        with:
          channel: "1.96.1"
          targets: x86_64-unknown-linux-musl,wasm32-unknown-unknown

      - run:
          "moon ${{ github.event.inputs.targets && github.event.inputs.targets || 'ci'}}"

      # docker-push has runInCI: false in tag-docker.yml to prevent moon ci
      # from pushing images on PRs (GITHUB_TOKEN has packages:write).
      # However, runInCI: false also blocks `moon run` in CI, so we push
      # the images that were already built by moon ci's `docker` task.
      - name: Push Docker images
        if: github.ref == 'refs/heads/main'
        run: |
          for IMAGE in $(docker image ls --filter 'reference=ghcr.io/incognito124/*' --format '{{.Repository}}:{{.Tag}}'); do
            echo "::group::Pushing ${IMAGE}"
            docker push "$IMAGE"
            echo "::endgroup::"
          done

      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Collect/retrospect on results"
        uses: "appthrust/moon-ci-retrospect@main"
        if: always()
