name: "Moon CI"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to run"
        required: false
        default: ""
        type: string

jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-dev musl-tools

      - name: Login to GitHub Container Registry
        uses: docker/login-action@master
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: "actions/checkout@main"
        with:
          fetch-depth: 0

      - uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true
          auto-setup: true
          cache: false

      # Proto installs Rust via rustup, but setup-rust defaults to installing
      # targets on 'stable'. Pin the channel to match the version in
      # .moon/toolchains.yml so targets land on the correct toolchain.
      - uses: moonrepo/setup-rust@v1
        with:
          channel: "1.96.0"
          targets: x86_64-unknown-linux-musl,wasm32-unknown-unknown

      # WORKAROUND: Moon's internal InstallDeps action runs `bun install` for
      # ALL JS projects before any user-defined tasks. brachi's package.json has
      # a file: dep on crates/brachistochrone_solver/pkg (wasm-pack output), but
      # that directory doesn't exist yet. This stub satisfies bun install until
      # brachistochrone-solver:build overwrites it with the real package.
      # See: https://github.com/moonrepo/moon/issues/2538
      - name: Stub wasm package for bun install
        run: |
          mkdir -p crates/brachistochrone_solver/pkg
          echo '{"name":"brachistochrone_solver","version":"0.0.0"}' > crates/brachistochrone_solver/pkg/package.json

      - run:
          "moon ${{ github.event.inputs.targets && github.event.inputs.targets || 'ci'}}"

      # docker-push is disabled in moon ci (runInCI: false in tag-docker.yml)
      # because GITHUB_TOKEN on PRs has packages:write, which would allow
      # unintended pushes. We run it explicitly here, gated to main.
      - name: Push Docker images
        if: github.ref == 'refs/heads/main'
        run: moon run :docker-push

      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Collect/retrospect on results"
        uses: "appthrust/moon-ci-retrospect@main"
        if: always()
