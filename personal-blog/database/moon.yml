$schema: https://moonrepo.dev/schemas/project.json
tasks:
  build:
    command: cargo build --release --locked
    outputs:
    - target/x86_64-unknown-linux-musl/release/database
  compile:
    command: uv run compile.py @in(0)
    inputs:
    - '@dirs(posts)'
    outputs:
    - db.sqlite3
    - feed.rss
    toolchain: python
  docker:
    deps:
    - compile
    - build
  docker-push:
    deps:
    - compile
    - build
language: rust
tags:
- docker
fileGroups:
  posts:
  - posts/*
project:
  description: The server for the personal blog database.
  title: personal-blog-database
layer: application
workspace:
  inheritedTasks:
    exclude:
    # The blog is staged as a whole from personal-blog-frontend:staging, which
    # depends on this project's docker task. Keeping a mirror-image staging
    # task here (depending on personal-blog-frontend:docker) makes the two
    # projects depend on each other; moon 2.5+ validates that as a cycle
    # instead of silently dropping one edge.
    - staging
