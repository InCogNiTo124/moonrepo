tags:
- sveltekit
- docker
layer: application
project:
  description: Terra Incognita, personal blog
  title: personal-blog-frontend
tasks:
  install:
    command: bun
    args:
    - install
    inputs:
    - package.json
    - bun.lock
  check:
    deps:
    - ~:install
    # Type-check the lib first: it is compiled from source (see the alias in
    # svelte.config.js), so its errors are this project's errors too.
    - personal-reusables:check
    options:
      mergeInputs: append
    inputs:
    # A dep's hash does not feed into this task's hash, so list the lib's
    # sources explicitly or edits to them would hit a stale cache.
    - /personal-reusables/src/**/*
  build:
    command: bun
    args:
    - run
    - build
    deps:
    - ~:install
    - personal-reusables:check
    inputs:
    - '@group(svelte)'
    - /personal-reusables/src/**/*
    outputs:
    - build/**
    options:
      merge: replace
  staging:
    script: |
      FRONTEND_LATEST_IMAGE=$(docker image ls --filter 'reference=ghcr.io/incognito124/personal-blog-frontend' --format "{{.Repository}}:{{.Tag}}" | sort -r | head -n 1)
      DB_LATEST_IMAGE=$(docker image ls --filter 'reference=ghcr.io/incognito124/personal-blog-database' --format "{{.Repository}}:{{.Tag}}" | sort -r | head -n 1)
      moon generate --force --to $projectSource docker-compose-blog -- --frontendDockerImage "$FRONTEND_LATEST_IMAGE" --dbDockerImage "$DB_LATEST_IMAGE"
      docker compose -f $projectSource/docker-compose.yaml up && docker compose -f $projectSource/docker-compose.yaml rm -fs && rm $projectSource/docker-compose.yaml
    deps:
    - docker
    - personal-blog-database:docker
